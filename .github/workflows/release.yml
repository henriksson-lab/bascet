name: Release binaries

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PACKAGE: bascet-cli
  BIN: bascet

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: bascet-linux-x86_64
            archive: tar.gz
            bin_suffix: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_name: bascet-macos-x86_64
            archive: tar.gz
            bin_suffix: ""
          - os: macos-15
            target: aarch64-apple-darwin
            asset_name: bascet-macos-aarch64
            archive: tar.gz
            bin_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: bascet-windows-x86_64
            archive: zip
            bin_suffix: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          CFLAGS_x86_64_unknown_linux_gnu: "-mno-avx512f -DLIBDEFLATE_ASSEMBLER_DOES_NOT_SUPPORT_AVX512VNNI -DLIBDEFLATE_ASSEMBLER_DOES_NOT_SUPPORT_AVX_VNNI -DLIBDEFLATE_ASSEMBLER_DOES_NOT_SUPPORT_VPCLMULQDQ"
          CFLAGS_x86_64_apple_darwin: "-DLIBDEFLATE_ASSEMBLER_DOES_NOT_SUPPORT_AVX512VNNI -DLIBDEFLATE_ASSEMBLER_DOES_NOT_SUPPORT_AVX_VNNI -DLIBDEFLATE_ASSEMBLER_DOES_NOT_SUPPORT_VPCLMULQDQ"
        run: |
          cargo +nightly build --profile=release --target "${{ matrix.target }}" -p "$PACKAGE" --all-features

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.asset_name }}"
          cp "target/${{ matrix.target }}/release/${BIN}${{ matrix.bin_suffix }}" "dist/${{ matrix.asset_name }}/"

      - name: Package Unix artifact
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          tar -C dist -czf "dist/${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}"

      - name: Package Windows artifact
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/${{ matrix.asset_name }}" -DestinationPath "dist/${{ matrix.asset_name }}.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}.${{ matrix.archive }}
          if-no-files-found: error

  checksums:
    name: Checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum bascet-* > checksums.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bascet-linux-x86_64.tar.gz
            dist/bascet-macos-x86_64.tar.gz
            dist/bascet-macos-aarch64.tar.gz
            dist/bascet-windows-x86_64.zip
            dist/checksums.txt
