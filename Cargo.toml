[workspace]
members = [
    "crates/bascet-core",
    "crates/bascet-cli",
    "crates/bascet-io",
    "crates/bascet-derive",
    "crates/bascet-variadic",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
bascet-core = { path = "crates/bascet-core" }
bascet-derive = { path = "crates/bascet-derive" }
bascet-variadic = { path = "crates/bascet-variadic" }

proc-macro2 = { version = "1.0" }
quote = { version = "1.0" }
syn = { version = "3.0" }
fnv = { version = "1.0" }

bon = { version = "3.9" }
branches = { version = "0.4" }
bytesize = { version = "2.6" }
compio = { version = "0.19", features = ["runtime", "time"] }
crossbeam-queue = { version = "0.3" }
crossbeam-utils = { version = "0.8" }
derive_more = { version = "2.1", features = ["display"] }
event-listener = { version = "5.4" }
inventory = { version = "0.3" }
kanal = { version = "0.1" }
memmap2 = { version = "0.9" }
page_size = { version = "0.6" }
parking_lot = { version = "0.12" }
thiserror = { version = "2.0" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }

# vendored bakes hwloc lib into binary
hwlocality = { version = "1.0.0-alpha.12", features = [
    "hwloc-2_4_0",
    "vendored",
] }
